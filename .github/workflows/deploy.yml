name: Deploy KEDA BlobWorker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  TERRAFORM_WORKING_DIR: './terraform'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Provision Infrastructure'
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.tf-outputs.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.tf-outputs.outputs.aks_cluster_name }}
      resource_group_name: ${{ steps.tf-outputs.outputs.resource_group_name }}
      managed_identity_client_id: ${{ steps.tf-outputs.outputs.managed_identity_client_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "managed_identity_client_id=$(terraform output -raw managed_identity_client_id)" >> $GITHUB_OUTPUT

  build-and-push:
    name: 'Build & Push Docker Image'
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ needs.terraform.outputs.acr_login_server }}

      - name: Build and Push Docker Image
        working-directory: ./BlobWorker
        run: |
          docker build -t ${{ needs.terraform.outputs.acr_login_server }}/blob-worker:${{ github.sha }} .
          docker build -t ${{ needs.terraform.outputs.acr_login_server }}/blob-worker:latest .
          docker push ${{ needs.terraform.outputs.acr_login_server }}/blob-worker:${{ github.sha }}
          docker push ${{ needs.terraform.outputs.acr_login_server }}/blob-worker:latest

  deploy-to-aks:
    name: 'Deploy to Kubernetes'
    runs-on: ubuntu-latest
    needs: [terraform, build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
            --name ${{ needs.terraform.outputs.aks_cluster_name }} \
            --overwrite-existing

      - name: Substitute Variables in K8s Manifest
        run: |
          export ACR_LOGIN_SERVER="${{ needs.terraform.outputs.acr_login_server }}"
          export IMAGE_TAG="${{ github.sha }}"
          export MANAGED_IDENTITY_CLIENT_ID="${{ needs.terraform.outputs.managed_identity_client_id }}"
          envsubst < k8s/deploy.yaml > k8s/deploy-substituted.yaml

      - name: Deploy to AKS
        run: kubectl apply -f k8s/deploy-substituted.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/csharp-blob-worker --timeout=120s || true
          kubectl get pods -l app=blob-worker
          kubectl get scaledobject azure-servicebus-queue-scaler
